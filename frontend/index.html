<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = window.localStorage.getItem('lens-theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else {
            var param = new URLSearchParams(window.location.search).get('scoutTheme');
            if (param === 'light' || param === 'dark') theme = param;
          }
        } catch (error) {
          theme = 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <style>
      /* Night Ledger theme tokens: the only place colour values are defined. */
      :root,
      html[data-theme='dark'] {
        color-scheme: dark;
        --lx-canvas: #0b0e0d;
        --lx-panel: #111614;
        --lx-raised: #171d1b;
        --lx-line: #232b28;
        --lx-line-strong: #34403b;
        --lx-ink: #e8ece7;
        --lx-ink-2: #a3ada7;
        /* Raised from #6E7973 so small text passes WCAG AA (4.98:1 on panel, 4.65:1 on raised). */
        --lx-ink-3: #7d8882;
        --lx-brass: #d4b06a;
        --lx-brass-ink: #1a1408;
        --lx-brass-soft: rgba(212, 176, 106, 0.12);
        --lx-up: #5cc59a;
        --lx-down: #ee7d66;
        --lx-warn: #e4b44c;
        --lx-focus: #f0d598;
        --lx-overlay: rgba(5, 7, 6, 0.72);
        --lx-shadow: rgba(0, 0, 0, 0.55);
        /* Text-field fill: inputs read as recessed wells in the dark theme. */
        --lx-field: #0b0e0d;
        --lx-display: 'Bahnschrift', 'DIN Alternate', 'Segoe UI Variable Display', 'Segoe UI', sans-serif;
        --lx-text: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        --lx-mono: 'Cascadia Mono', 'Cascadia Code', Consolas, ui-monospace, monospace;
      }
      html[data-theme='light'] {
        color-scheme: light;
        --lx-canvas: #edf0ee;
        --lx-panel: #f8faf9;
        --lx-raised: #ffffff;
        --lx-line: #d5dcd8;
        --lx-line-strong: #aeb9b3;
        --lx-ink: #0e1412;
        --lx-ink-2: #46524c;
        /* Darkened from #66726C for AA on canvas (4.92:1); up/down/warn darkened for AA on canvas and panel. */
        --lx-ink-3: #5e6a64;
        --lx-brass: #8a6420;
        --lx-brass-ink: #ffffff;
        --lx-brass-soft: rgba(138, 100, 32, 0.1);
        --lx-up: #1a7951;
        --lx-down: #b6412a;
        --lx-warn: #8e6207;
        --lx-focus: #8a6420;
        --lx-overlay: rgba(14, 20, 18, 0.45);
        --lx-shadow: rgba(14, 20, 18, 0.18);
        --lx-field: #ffffff;
      }
      html {
        background: var(--lx-canvas);
        color: var(--lx-ink);
      }
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23D4B06A' stroke='%230B0E0D' stroke-width='1.1' stroke-linejoin='round'%3E%3Cpath d='M20.85 13.2L30.26 18.63A14.5 14.5 0 0 1 20.85 29.66Z'/%3E%3Cpath d='M20.85 18.8L20.85 29.66A14.5 14.5 0 0 1 6.59 27.03Z'/%3E%3Cpath d='M16 21.6L6.59 27.03A14.5 14.5 0 0 1 1.74 13.37Z'/%3E%3Cpath d='M11.15 18.8L1.74 13.37A14.5 14.5 0 0 1 11.15 2.34Z'/%3E%3Cpath d='M11.15 13.2L11.15 2.34A14.5 14.5 0 0 1 25.41 4.97Z'/%3E%3Cpath d='M16 10.4L25.41 4.97A14.5 14.5 0 0 1 30.26 18.63Z'/%3E%3C/g%3E%3C/svg%3E"
    />
    <meta name="description" content="LENS: local portfolio risk analysis with public market data." />
    <title>LENS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
