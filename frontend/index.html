<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f1e8" />
    <script>
      (function () {
        var theme = 'light';
        try {
          var stored = window.localStorage.getItem('lens-theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else {
            var param = new URLSearchParams(window.location.search).get('scoutTheme');
            if (param === 'light' || param === 'dark') theme = param;
          }
        } catch (error) {
          theme = 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#15181d' : '#f5f1e8');
      })();
    </script>
    <style>
      /* Research-note theme tokens: the only place color values and font stacks are defined.
         Light (paper) is the default; dark is the evening edition of the same design. */
      :root,
      html[data-theme='light'] {
        color-scheme: light;
        --lx-canvas: #f5f1e8;
        --lx-panel: #faf7f0;
        --lx-raised: #ffffff;
        --lx-line: #d8cfbe;
        --lx-line-strong: #2a2e35;
        /* Borders of quiet controls (switcher, toggles): 3.42:1 on canvas for non-text contrast. */
        --lx-control-line: #808286;
        --lx-ink: #1c2026;
        --lx-ink-2: #474c54;
        /* 4.82:1 on canvas, 5.08:1 on panel, 5.43:1 on raised (WCAG AA for small text). */
        --lx-ink-3: #666a71;
        --lx-accent: #1f3a5f;
        --lx-accent-ink: #ffffff;
        --lx-accent-soft: rgba(31, 58, 95, 0.08);
        --lx-up: #2d6a44;
        --lx-down: #9a2c36;
        --lx-warn: #8a5a00;
        /* Chart series after the accent: ochre, then slate. Used for lines and marks, never for text. */
        --lx-series-2: #a8782a;
        --lx-series-3: #6b7785;
        --lx-focus: #1f3a5f;
        --lx-overlay: rgba(20, 22, 26, 0.4);
        --lx-shadow: rgba(20, 22, 26, 0.1);
        --lx-field: #ffffff;
        --lx-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
        --lx-display: var(--lx-serif);
        --lx-text: 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif;
        --lx-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --lx-canvas: #15181d;
        --lx-panel: #1a1e24;
        --lx-raised: #222731;
        --lx-line: #30363f;
        --lx-line-strong: #c8c1b2;
        --lx-control-line: #76726a;
        --lx-ink: #ece7dc;
        --lx-ink-2: #bcb6aa;
        /* 5.54:1 on canvas, 5.21:1 on panel, 4.66:1 on raised. */
        --lx-ink-3: #958f84;
        --lx-accent: #a9c1e0;
        --lx-accent-ink: #0f1520;
        --lx-accent-soft: rgba(169, 193, 224, 0.12);
        --lx-up: #86c39b;
        --lx-down: #e8939a;
        --lx-warn: #d9b36b;
        --lx-series-2: #cfa45a;
        --lx-series-3: #9aa6b4;
        --lx-focus: #a9c1e0;
        --lx-overlay: rgba(6, 8, 10, 0.6);
        --lx-shadow: rgba(0, 0, 0, 0.35);
        --lx-field: #12151a;
      }
      html {
        background: var(--lx-canvas);
        color: var(--lx-ink);
      }
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231F3A5F'/%3E%3Cpath fill='%23FFFFFF' d='M7.5 6H17v1.6h-2.5v16.7h8.1v-3.8h1.9V26H7.5v-1.7H10V7.6H7.5Z'/%3E%3C/svg%3E"
    />
    <meta name="description" content="LENS: portfolio risk notes computed on this computer from public market data." />
    <title>LENS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
